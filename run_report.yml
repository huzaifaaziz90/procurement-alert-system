name: Run Procurement Report

on:
  schedule:
    - cron: '50 7 * * *'  # 7:50am UTC daily (before n8n runs at 8am)
  workflow_dispatch:  # allows manual trigger from GitHub

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl gspread google-auth google-api-python-client

      - name: Run procurement report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/procurement_report.py --auto